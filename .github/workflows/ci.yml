name: CI

on:
  push:
    branches: [master, arena/**]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src/sanskrit_nlp --ignore-missing-imports

      - name: Run tests
        run: pytest -q

      - name: Smoke CLI
        run: |
          python -m sanskrit_nlp.cli version
          python -m sanskrit_nlp.cli analyze "सूर्योदय" | python -c "import sys,json; json.load(sys.stdin)"
